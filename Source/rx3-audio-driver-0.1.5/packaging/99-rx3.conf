# Four-channel, exclusive playback: Master L/R, headphones L/R.
# Native PCM accepts S32_LE or S24_3LE at 44100 Hz.
pcm.rx3 {
    type rx3
    hint {
        show on
        description "Pioneer XDJ-RX3: Master + Headphones (4 channels, 44.1 kHz)"
        ioid "Output"
    }
}

# Direct native Linux endpoint. ALSA plug converts client formats locally;
# the RX3 ioplug opens USB itself. No audio server is used by this endpoint.
pcm.rx3_native {
    type plug
    slave {
        pcm {
            # ALSA's format converters require mmap access. This adapter
            # forwards to our writei-based PCM in the application process.
            type mmap_emul
            slave.pcm {
                type rx3
                native_profile true
            }
        }
        format S32_LE
        rate 44100
        channels 4
    }
    hint {
        show on
        description "Pioneer RX3 (ALSA)"
        ioid "Output"
    }
}
